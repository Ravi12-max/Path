<title>Pehla Raasta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
  /* Layout: one narrow left-aligned column. A trail of five named stops sits above the screen; one thing is on screen at a time. */
  :root {
    --bg: #F2F4F0;
    --surface: #FFFFFF;
    --fg: #17211D;
    --muted: #55645D;
    --line: #D3DAD3;
    --accent: #0E6A5E;
    --accent-fg: #FFFFFF;
    --warm: #A95F14;
    --font-display: "Tiro Devanagari Hindi", Georgia, "Times New Roman", serif;
    --font-body: "Mukta", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1513; --surface: #17201C; --fg: #E5ECE7; --muted: #9AA9A1;
      --line: #2A3731; --accent: #5CC7B6; --accent-fg: #08201B; --warm: #E0A15A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1513; --surface: #17201C; --fg: #E5ECE7; --muted: #9AA9A1;
    --line: #2A3731; --accent: #5CC7B6; --accent-fg: #08201B; --warm: #E0A15A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.6;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--font-display); font-size: 1.35rem; margin: 0; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
  .lang button { border: 0; background: transparent; padding: 4px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 0.95rem; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

  /* Trail */
  .trail { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .trail li { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .trail .bar { height: 4px; border-radius: 4px; background: var(--line); }
  .trail .name { font-size: 0.78rem; letter-spacing: 0.02em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trail li.done .bar { background: var(--accent); opacity: 0.55; }
  .trail li.now .bar { background: var(--accent); }
  .trail li.now .name { color: var(--fg); font-weight: 600; }
  .stepcount { margin: 0; font-size: 0.9rem; color: var(--muted); }

  main { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 6.5vw, 2.6rem); line-height: 1.2; margin: 0; text-wrap: balance; }
  h1:focus { outline: none; }
  .lead { margin: 0; color: var(--muted); max-width: 60ch; }
  p { margin: 0; }

  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); padding: 11px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 400; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  /* World terms */
  .terms { margin: 0; display: flex; flex-direction: column; }
  .terms > div { padding-block: 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 110px 1fr; gap: 6px 16px; }
  .terms > div:last-child { border-bottom: 1px solid var(--line); }
  .terms dt { font-family: var(--font-display); font-size: 1.25rem; color: var(--accent); }
  .terms dd { margin: 0; min-width: 0; }
  @media (max-width: 480px) { .terms > div { grid-template-columns: 1fr; } }

  /* Options */
  .opts { display: flex; flex-direction: column; gap: 10px; border: 0; margin: 0; padding: 0; min-width: 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; min-width: 0; }
  .opt input { margin-top: 7px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 3px; }
  .qtag { margin: 0; font-size: 0.9rem; color: var(--warm); font-weight: 600; letter-spacing: 0.03em; }

  /* Paths */
  .path-top { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .path-name { font-family: var(--font-display); font-size: 1.3rem; }
  .match { font-size: 0.85rem; color: var(--warm); font-weight: 600; }
  .pc { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 24px; margin-top: 10px; font-size: 0.95rem; }
  .pc h3 { margin: 0 0 4px; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .pc ul { margin: 0; padding-left: 18px; }
  .opt .body { min-width: 0; flex: 1; }

  .action { border-left: 4px solid var(--accent); padding: 4px 0 4px 18px; font-size: 1.15rem; }
  .after { color: var(--muted); }

  footer { border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.92rem; color: var(--muted); }
  footer strong { color: var(--fg); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: rise 0.28s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>

<div class="wrap">
  <header>
    <p class="brand" id="brand"></p>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="l-hi" aria-pressed="true">हिन्दी</button>

  <main id="main"></main>

  <footer id="foot"></footer>
</div>

    else if (step === 1) {
      h = stepLine + '<h1 tabindex="-1">' + t.s2.h + '</h1><p class="lead">' + t.s2.lead + "</p><dl class=\"terms\">" +
        t.s2.items.map(function (i) { return "<div><dt>" + i[0] + "</dt><dd>" + i[1] + "</dd></div>"; }).join("") +
        '</dl><div class="btnrow"><button class="btn ghost" data-go="0">' + t.back + '</button><button class="btn" data-go="2">' + t.next + "</button></div>";
    }

    else if (step === 2) {
      var q = t.s3.qs[qi];
      var isLast = qi === t.s3.qs.length - 1;
      h = stepLine + '<h1 tabindex="-1">' + t.s3.h + '</h1>' + (qi === 0 ? '<p class="lead">' + t.s3.lead + "</p>" : "") +
        '<p class="qtag">' + t.s3.qOf(qi) + '</p>' +
        '<fieldset class="opts"><legend style="font-size:1.2rem;font-weight:600;margin-bottom:12px;padding:0">' + q.q + "</legend>" +
        q.o.map(function (o, i) {
          var on = answers[qi] === o[1] ? " checked" : "";
          return '<label class="opt"><input type="radio" name="q" value="' + o[1] + '"' + on + '><span>' + o[0] + "</span></label>";
        }).join("") + "</fieldset>" +
        '<div class="btnrow"><button class="btn ghost" data-qback="1">' + t.back + '</button><button class="btn" id="qnext"' + (answers[qi] ? "" : " disabled") + ">" + (isLast ? t.s3.last : t.next) + "</button></div>";
    }

    else if (step === 3) {
      var sc = scores();
      var order = PATH_ORDER.slice().sort(function (a, b) { return sc[b] - sc[a]; });
      if (!pending) pending = chosen;
      h = stepLine + '<h1 tabindex="-1">' + t.s4.h + '</h1><p class="lead">' + t.s4.lead + '</p><fieldset class="opts"><legend class="lead" style="position:absolute;left:-9999px">' + t.s4.h + "</legend>" +
        order.map(function (k) {
          var p = t.s4.paths[k];
          return '<label class="opt"><input type="radio" name="path" value="' + k + '"' + (pending === k ? " checked" : "") + '><span class="body"><span class="path-top"><span class="path-name">' + p.n + "</span>" +
            (sc[k] > 0 ? '<span class="match">' + t.s4.match(sc[k]) + "</span>" : "") + "</span>" +
            "<span style=\"display:block;margin-top:4px\">" + p.d + "</span>" +
            '<span class="pc"><span><h3>' + t.s4.pros + "</h3><ul>" + p.p.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></span>" +
            "<span><h3>" + t.s4.cons + "</h3><ul>" + p.c.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></span></span></span></label>";
        }).join("") + "</fieldset>" +
        '<div class="btnrow"><button class="btn ghost" data-go="2">' + t.back + '</button><button class="btn" id="pick"' + (pending ? "" : " disabled") + ">" + t.s4.go + "</button></div>";
    }

    else {
      var pn = t.s4.paths[chosen].n;
      h = stepLine + '<h1 tabindex="-1">' + t.s5.h + '</h1><p class="lead">' + t.s5.lead(pn) + '</p>' +
        '<p class="action">' + t.s5.actions[chosen] + '</p><p class="after">' + t.s5.after + '</p>' +
        '<div class="btnrow"><button class="btn ghost" data-go="3">' + t.s5.other + '</button><button class="btn ghost" id="restart">' + t.s5.restart + "</button></div>";
    }
    return h;
  }

  function render(focus) {
    drawChrome();
    $main.innerHTML = view();
    if (focus) { var h1 = $main.querySelector("h1"); if (h1) h1.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  }

  function go(n) {
    step = n;
    if (n === 2) { qi = 0; }
    if (n === 3) { pending = chosen; }
    render(true);
  }

  $main.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-go")) { go(parseInt(b.getAttribute("data-go"), 10)); return; }
    if (b.hasAttribute("data-qback")) { if (qi > 0) { qi--; render(false); } else { go(1); } return; }
    if (b.id === "qnext") {
      if (qi < T().s3.qs.length - 1) { qi++; render(false); } else { go(3); }
      return;
    }
    if (b.id === "pick" && pending) { chosen = pending; go(4); return; }
    if (b.id === "restart") { answers = []; chosen = null; pending = null; qi = 0; go(0); }
  });

  $main.addEventListener("change", function (e) {
    var i = e.target;
    if (i.name === "q") { answers[qi] = i.value; document.getElementById("qnext").disabled = false; }
    if (i.name === "path") { pending = i.value; document.getElementById("pick").disabled = false; }
  });

  function setLang(l) {
    lang = l;
    try { localStorage.setItem("pr-lang", l); } catch (e) {}
    render(false);
  }
  document.getElementById("l-hi").addEventListener("click", function () { setLang("hi"); });
  document.getElementById("l-en").addEventListener("click", function () { setLang("en"); });

  render(false);
})();
</script>
